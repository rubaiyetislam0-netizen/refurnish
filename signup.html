<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — ReFurnish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.wrap { min-height: 100vh; display: flex; flex-wrap: wrap; }
.side { flex: 1 1 480px; background: var(--oak); padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.side li { display: flex; gap: 12px; align-items: flex-start; }
.side li svg { flex: none; margin-top: 3px; color: var(--oak-deep); }
.form-side { flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 56px 32px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.otp input { height: 56px; padding: 0; text-align: center; font-size: 22px; font-weight: 700; }
.otp input:focus { border: 2px solid var(--oak-deep); outline: none; }
@media (max-width: 600px) {
  .side { padding: 24px 16px; gap: 24px; }
  .side .h-big { font-size: 36px !important; line-height: 42px !important; }
  .side .proof { display: none !important; }
  .form-side { padding: 32px 16px 56px; }
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <a href="index.html" class="logo on-oak" aria-label="ReFurnish home"><span class="arch" aria-hidden="true"></span><span><span class="re">Re</span>Furnish</span></a>
    <div style="display: flex; flex-direction: column; gap: 28px; max-width: 460px">
      <p class="h-big" style="margin: 0; font-weight: 700; letter-spacing: -0.02em; font-size: 56px; line-height: 60px">Give good furniture a second home.</p>
      <ul id="perks">
        <li><span>List a piece in about two minutes</span></li>
        <li><span>Chat with buyers without sharing your number</span></li>
        <li><span>Get paid by bKash, Nagad, card or cash</span></li>
      </ul>
    </div>
    <div class="proof" style="background: var(--bg); border-radius: 16px; padding: 20px; display: flex; gap: 14px; align-items: center; max-width: 420px">
      <span style="width: 64px; flex: none" id="proofImg"></span>
      <div style="display: flex; flex-direction: column">
        <span class="small muted">Just sold in Dhanmondi</span>
        <span style="font-weight: 600">Teak lounge chair</span>
        <span style="font-size: 18px; font-weight: 700">৳ 14,500</span>
      </div>
    </div>
  </aside>

  <main class="form-side">
    <div style="width: 100%; max-width: 420px" id="step"></div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  RF.$all('#perks li').forEach(function (li) { li.insertAdjacentHTML('afterbegin', RF.icon('check')); });
  RF.$('#proofImg').innerHTML = RF.well({ cat: 'Chairs' });
  var google = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h6a5.1 5.1 0 0 1-2.2 3.3v2.8h3.6c2.1-1.9 3.2-4.8 3.2-7.9z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.3-.4-2s.1-1.4.4-2V7.1H2a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2 7.1L5.7 10c.9-2.6 3.4-4.6 6.3-4.6z"/></svg>';
  var f = { name: '', phone: '', pw: '', agree: false };
  var step = 'form', err = null, timer = null, left = 42;
  var el = RF.$('#step');

  function render() {
    clearInterval(timer);
    if (step === 'form') {
      el.innerHTML = '<div style="display:flex;flex-direction:column;gap:28px">' +
        '<div style="display:flex;flex-direction:column;gap:6px"><h1 class="h-l">Create your account</h1><p style="margin:0" class="muted">Buy and sell with your neighbors. It’s free.</p></div>' +
        '<button type="button" class="btn btn-secondary btn-block" id="google" style="background:#fff">' + google + 'Continue with Google</button>' +
        '<div class="divider">or with your phone</div>' +
        '<form id="form" novalidate style="display:flex;flex-direction:column;gap:20px">' +
          '<div class="form-row"><label for="name" class="flabel">Full name</label><input id="name" class="field' + (err === 'name' ? ' invalid' : '') + '" autocomplete="name" placeholder="Nadia Rahman" value="' + RF.esc(f.name) + '"></div>' +
          '<div class="form-row"><label for="phone" class="flabel">Mobile number</label><div class="phone-row"><span class="phone-prefix">+880</span><input id="phone" class="field' + (err === 'phone' ? ' invalid' : '') + '" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="1712 345678" value="' + RF.esc(f.phone) + '"></div>' +
            '<span class="help">We’ll text you a code. Buyers never see this number unless you share it.</span></div>' +
          '<div class="form-row"><label for="pw" class="flabel">Password</label><input id="pw" class="field' + (err === 'pw' ? ' invalid' : '') + '" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>' +
          '<label class="check small muted" style="align-items:flex-start"><input type="checkbox" id="agree"' + (f.agree ? ' checked' : '') + '><span>I agree to the <a href="#">terms</a> and <a href="#">privacy policy</a>.</span></label>' +
          (err ? '<div class="error" role="alert">' + RF.icon('alert', 18) + {
            name: 'Add your name so buyers know who they’re talking to.',
            phone: 'Add your mobile number so we can send a code.',
            pw: 'Use a password with at least 8 characters.',
            agree: 'Please agree to the terms to continue.'
          }[err] + '</div>' : '') +
          '<button type="submit" class="btn btn-primary btn-block">Create account</button>' +
        '</form>' +
        '<p style="margin:0;text-align:center" class="small muted">Already have an account? <a href="signin.html" style="font-weight:600">Sign in</a></p></div>';
      return;
    }
    if (step === 'verify') {
      left = 42;
      el.innerHTML = '<div style="display:flex;flex-direction:column;gap:28px">' +
        '<button type="button" id="back" style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0;border:0;background:transparent;font:600 14px var(--font);color:var(--ink);cursor:pointer">' + RF.icon('left') + 'Back</button>' +
        '<div style="display:flex;flex-direction:column;gap:6px"><h1 class="h-l">Check your phone</h1><p style="margin:0" class="muted">Enter the 6-digit code we sent to +880 ' + RF.esc(f.phone) + '.</p></div>' +
        '<form id="otpForm" novalidate style="display:flex;flex-direction:column;gap:28px"><fieldset><legend class="sr-only">Verification code</legend><div class="otp">' +
          [1, 2, 3, 4, 5, 6].map(function (i) { return '<input class="field" aria-label="Digit ' + i + '" inputmode="numeric" maxlength="1" autocomplete="' + (i === 1 ? 'one-time-code' : 'off') + '">'; }).join('') +
        '</div></fieldset>' +
        '<div class="error" role="alert" id="otpErr" hidden>' + RF.icon('alert', 18) + 'Enter all 6 digits.</div>' +
        '<button type="submit" class="btn btn-primary btn-block">Verify</button></form>' +
        '<p style="margin:0" class="small muted" id="resend"></p></div>';
      var boxes = RF.$all('.otp input');
      boxes[0].focus();
      boxes.forEach(function (b, i) {
        b.addEventListener('input', function () {
          var v = b.value.replace(/\D/g, '');
          if (v.length > 1) { v.split('').slice(0, 6 - i).forEach(function (d, j) { boxes[i + j].value = d; }); boxes[Math.min(5, i + v.length - 1)].focus(); return; }
          b.value = v; if (v && i < 5) boxes[i + 1].focus();
          RF.$('#otpErr').hidden = true;
        });
        b.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !b.value && i > 0) boxes[i - 1].focus(); });
      });
      var tick = function () {
        var r = RF.$('#resend'); if (!r) return;
        r.innerHTML = left > 0 ? 'Didn’t get it? You can resend in 0:' + String(left).padStart(2, '0')
          : 'Didn’t get it? <button type="button" class="link-btn" id="resendBtn">Resend code</button>';
        if (left <= 0) clearInterval(timer);
        left--;
      };
      tick(); timer = setInterval(tick, 1000);
      return;
    }
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:24px">' +
      '<span style="width:56px;height:56px;border-radius:999px;background:var(--oak);color:var(--oak-deep);display:flex;align-items:center;justify-content:center" aria-hidden="true">' + RF.icon('shield', 26) + '</span>' +
      '<div style="display:flex;flex-direction:column;gap:6px"><h1 class="h-l">You’re verified</h1><p style="margin:0" class="muted">Your profile now shows a Verified badge. What would you like to do first?</p></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px"><a class="btn btn-primary btn-block" href="index.html">Start browsing</a><a class="btn btn-secondary btn-block" href="sell.html">List an item</a></div></div>';
  }

  el.addEventListener('submit', function (e) {
    e.preventDefault();
    if (step === 'form') {
      f.name = RF.$('#name').value.trim(); f.phone = RF.$('#phone').value.trim(); f.agree = RF.$('#agree').checked;
      var pw = RF.$('#pw').value;
      err = !f.name ? 'name' : f.phone.replace(/\D/g, '').length < 10 ? 'phone' : pw.length < 8 ? 'pw' : !f.agree ? 'agree' : null;
      if (err) { render(); var t = RF.$('#' + err); if (t) t.focus(); return; }
      step = 'verify'; render(); return;
    }
    if (step === 'verify') {
      var code = RF.$all('.otp input').map(function (b) { return b.value; }).join('');
      if (code.length < 6) { RF.$('#otpErr').hidden = false; return; }
      // Demo: any 6 digits verify. Connect an SMS provider for real codes.
      RF.store.set('account', { name: f.name, phone: f.phone });
      RF.signIn({ name: f.name, phone: f.phone });
      step = 'done'; render();
    }
  });
  el.addEventListener('click', function (e) {
    if (e.target.closest('#back')) { step = 'form'; err = null; render(); return; }
    if (e.target.closest('#resendBtn')) { RF.toast('New code sent'); left = 42; clearInterval(timer); render(); return; }
    if (e.target.closest('#google')) { RF.signIn({ name: 'Google user', email: 'you@gmail.com' }); location.href = 'index.html'; }
  });
  render();
})();
</script>
</body>
</html>
